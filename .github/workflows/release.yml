name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag / Version (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'
      release_name:
        description: 'Release Name (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Engine (Windows)
        shell: pwsh
        run: |
          cd simc-engine
          if (Test-Path simc_vs2026.sln) {
            msbuild simc_vs2026.sln /p:Configuration=Release /p:Platform=x64 /m
          } else {
            msbuild simc_vs2022.sln /p:Configuration=Release /p:Platform=x64 /m
          }
          cd ..

      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package
          
          # Find and copy simc.exe from submodule build output
          if (Test-Path simc-engine\bin\x64\Release\simc.exe) {
            Copy-Item simc-engine\bin\x64\Release\simc.exe release-package\simc.exe
          } elseif (Test-Path simc-engine\build\Release\simc.exe) {
            Copy-Item simc-engine\build\Release\simc.exe release-package\simc.exe
          } elseif (Test-Path simc-engine\simc.exe) {
            Copy-Item simc-engine\simc.exe release-package\simc.exe
          } elseif (Test-Path simc.exe) {
            Copy-Item simc.exe release-package\simc.exe
          }
          
          if (Test-Path start_ui.bat) { Copy-Item start_ui.bat release-package\ }
          if (Test-Path start_ui.sh) { Copy-Item start_ui.sh release-package\ }
          
          # Copy APL directory (excluding development folder)
          New-Item -ItemType Directory -Force -Path release-package\apl
          if (Test-Path apl) {
            Get-ChildItem -Path apl -Exclude "development" | Copy-Item -Destination release-package\apl -Recurse -Force
          }
          
          # Copy tools (needed by /api/replay/run), skipping local scratch folders
          if (Test-Path tools) {
            New-Item -ItemType Directory -Force -Path release-package\tools
            Get-ChildItem -Path tools -Filter *.py | Copy-Item -Destination release-package\tools -Force
          }
          
          # Copy Profiles if present
          if (Test-Path profiles) { Copy-Item -Recurse profiles release-package\profiles }
          
          # Copy UI directory (excluding pycache and local configs)
          Copy-Item -Recurse ui release-package\ui
          Remove-Item -Recurse -Force release-package\ui\__pycache__ -ErrorAction SilentlyContinue
          Remove-Item -Force release-package\ui\*config.json -ErrorAction SilentlyContinue
          
          # Sanity check: fail the build if required files are missing
          $required = @(
            "release-package\simc.exe",
            "release-package\start_ui.bat",
            "release-package\ui\server.py",
            "release-package\tools\extract_combat_log_timeline.py",
            "release-package\tools\generate_replay_report.py"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing from release package: $f" }
          }
          
          # Create ZIP archive
          Compress-Archive -Path release-package\* -DestinationPath simc-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simc-windows
          path: simc-windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: simc-windows

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('FellowSimc UI - {0}', inputs.tag_name || github.ref_name) }}
          files: |
            simc-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true